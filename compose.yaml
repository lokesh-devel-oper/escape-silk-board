name: escape-silk-board

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOWED_ORIGINS: ${DOCKER_ALLOWED_ORIGINS:-http://localhost:18080,http://127.0.0.1:18080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-5}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-1}
      GEMINI_MIN_CONFIDENCE: ${GEMINI_MIN_CONFIDENCE:-0.55}
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/gameplay/}
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${APP_PORT:-18080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
