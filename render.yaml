services:
  - type: web
    name: escape-silk-board-api
    runtime: python
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_TIMEOUT_SECONDS
        value: "5"
      - key: GEMINI_MAX_RETRIES
        value: "1"
      - key: GEMINI_MIN_CONFIDENCE
        value: "0.55"
